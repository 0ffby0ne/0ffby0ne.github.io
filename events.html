<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#09090b">
<title>events — offby0ne</title>
<meta name="description" content="offby0ne ctf events — upcoming and past.">
<style>
:root{
--bg:#09090b;
--fg:#d4d4d8;
--dim:#6b6b74;
--accent:#ff5c33;
--rule:#1c1c20;
--mono: "Berkeley Mono", "JetBrains Mono", "Fira Code", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
background:var(--bg);
color:var(--fg);
font-family:var(--mono);
font-size:15px;
line-height:1.7;
min-height:100svh;
padding:8vh 6vw;
}
.wrap{max-width:640px; margin:0 auto; width:100%;}
.prompt{color:var(--dim); font-size:13px; letter-spacing:0.02em; margin-bottom:0.4em;}
.prompt .path{color:var(--accent);}
h1{
font-size:clamp(1.8rem, 5vw, 2.6rem);
font-weight:400;
letter-spacing:-0.02em;
margin:0.3em 0 0.6em;
color:var(--fg);
}
.rule{border:none; border-top:1px solid var(--rule); margin:1.6em 0;}

.topnav{
position:absolute;
top:6vh; right:6vw;
display:flex; gap:1.4em;
font-size:13px;
}
.topnav a{
color:var(--dim);
text-decoration:none;
transition:color 0.15s ease;
}
.topnav a.active{color:var(--accent);}
.topnav a:hover, .topnav a:focus-visible{
color:var(--accent);
text-shadow:0 0 12px rgba(255,92,51,0.6);
}
.topnav .sep{color:var(--rule);}
@media (max-width:640px){
.topnav{
position:static;
justify-content:center;
margin-bottom:2em;
}
}

.events{list-style:none; margin:0; padding:0;}
.event{
display:flex;
justify-content:space-between;
align-items:center;
border:1px solid var(--rule);
border-radius:3px;
padding:0.7em 1em;
margin-bottom:0.7em;
}
.event .name{color:var(--fg); font-size:14px;}
.badge{
font-size:11px;
padding:0.2em 0.6em;
border-radius:3px;
border:1px solid var(--rule);
color:var(--dim);
}
.badge.registered{
color:var(--accent);
border-color:var(--accent);
}

footer{margin-top:3em; font-size:12px; color:var(--dim);}
footer .cur{
display:inline-block; width:0.55em; height:1.1em; background:var(--accent);
vertical-align:text-bottom; margin-left:2px;
animation:blink 1.1s steps(1) infinite;
}
@keyframes blink{ 0%,49%{opacity:1;} 50%,100%{opacity:0;} }
@media (prefers-reduced-motion: reduce){
footer .cur{animation:none;}
}
::selection{background:var(--accent); color:#09090b;}
</style>
</head>
<body>

<nav class="topnav">
<a href="/writeups">writeups</a>
<span class="sep">//</span>
<a href="/team">team</a>
<span class="sep">//</span>
<a href="/rankings">rankings</a>
<span class="sep">//</span>
<a href="/events" class="active">events</a>
</nav>

<div class="wrap">
<div class="prompt">offby0ne@iitm:<span class="path">~/events</span>$ ls upcoming/ past/</div>
<h1>events</h1>

<hr class="rule">

<ul class="events">
<li class="event">
<span class="name">upcoming-ctf-2026</span>
<span class="badge registered">registered</span>
</li>
<li class="event">
<span class="name">example-ctf-2025</span>
<span class="badge">rank --</span>
</li>
<li class="event">
<span class="name">example-ctf-2024</span>
<span class="badge">rank --</span>
</li>
</ul>

<footer>events populate as we register / compete<span class="cur"></span></footer>
</div>

</body>
</html>
