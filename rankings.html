<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#09090b">
<title>rankings — offby0ne</title>
<meta name="description" content="offby0ne ctftime rating and rankings.">
<style>
:root{
--bg:#09090b;
--fg:#d4d4d8;
--dim:#6b6b74;
--accent:#ff5c33;
--rule:#1c1c20;
--mono: "Berkeley Mono", "JetBrains Mono", "Fira Code", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
background:var(--bg);
color:var(--fg);
font-family:var(--mono);
font-size:15px;
line-height:1.7;
min-height:100svh;
padding:8vh 6vw;
}
.wrap{max-width:640px; margin:0 auto; width:100%;}
.prompt{color:var(--dim); font-size:13px; letter-spacing:0.02em; margin-bottom:0.4em;}
.prompt .path{color:var(--accent);}
h1{
font-size:clamp(1.8rem, 5vw, 2.6rem);
font-weight:400;
letter-spacing:-0.02em;
margin:0.3em 0 0.6em;
color:var(--fg);
}
.rule{border:none; border-top:1px solid var(--rule); margin:1.6em 0;}

.topnav{
position:absolute;
top:6vh; right:6vw;
display:flex; gap:1.4em;
font-size:13px;
}
.topnav a{
color:var(--dim);
text-decoration:none;
transition:color 0.15s ease;
}
.topnav a.active{color:var(--accent);}
.topnav a:hover, .topnav a:focus-visible{
color:var(--accent);
text-shadow:0 0 12px rgba(255,92,51,0.6);
}
.topnav .sep{color:var(--rule);}
@media (max-width:640px){
.topnav{
position:static;
justify-content:center;
margin-bottom:2em;
}
}

.stats{
display:grid;
grid-template-columns:repeat(3, 1fr);
gap:1em;
margin:0 0 2em;
}
.stat{
border:1px solid var(--rule);
border-radius:3px;
padding:0.9em;
text-align:center;
}
.stat .label{color:var(--dim); font-size:11px;}
.stat .value{color:var(--accent); font-size:20px; margin-top:0.3em;}

table{
width:100%;
border-collapse:collapse;
font-size:13px;
}
th{
text-align:left;
color:var(--dim);
font-weight:400;
border-bottom:1px solid var(--rule);
padding:0.5em 0.4em;
}
td{
border-bottom:1px solid var(--rule);
padding:0.6em 0.4em;
color:var(--fg);
}

footer{margin-top:3em; font-size:12px; color:var(--dim);}
footer .cur{
display:inline-block; width:0.55em; height:1.1em; background:var(--accent);
vertical-align:text-bottom; margin-left:2px;
animation:blink 1.1s steps(1) infinite;
}
@keyframes blink{ 0%,49%{opacity:1;} 50%,100%{opacity:0;} }
@media (prefers-reduced-motion: reduce){
footer .cur{animation:none;}
}
::selection{background:var(--accent); color:#09090b;}
</style>
</head>
<body>

<nav class="topnav">
<a href="/">home</a>
<span class="sep">//</span>
<a href="/writeups">writeups</a>
<span class="sep">//</span>
<a href="/team">team</a>
<span class="sep">//</span>
<a href="/rankings" class="active">rankings</a>
<span class="sep">//</span>
<a href="/events">events</a>
</nav>

<div class="wrap">
<div class="prompt">offby0ne@iitm:<span class="path">~/rankings</span>$ ctftime rating --team offby0ne</div>
<h1>rankings</h1>

<div class="stats">
<div class="stat"><div class="label">rating</div><div class="value">--</div></div>
<div class="stat"><div class="label">country rank</div><div class="value">--</div></div>
<div class="stat"><div class="label">global rank</div><div class="value">--</div></div>
</div>

<hr class="rule">

<table>
<thead>
<tr><th>event</th><th>placement</th><th>points</th></tr>
</thead>
<tbody>
<tr><td>example-ctf-2026</td><td>--</td><td>--</td></tr>
<tr><td>example-ctf-2025</td><td>--</td><td>--</td></tr>
</tbody>
</table>

<footer>full history on <a href="https://ctftime.org/" target="_blank" rel="noopener" style="color:var(--accent); text-decoration:none;">ctftime</a><span class="cur"></span></footer>
</div>

</body>
</html>
